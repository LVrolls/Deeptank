<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEP TANK</title>
<style>
:root{
  --abyss:#050b11; --hull:#0b1620; --hull2:#0f1e2a; --rule:#1b3241;
  --dim:#6f93a4; --read:#d6ebf2; --lume:#4fd8c4; --amber:#ffb24a;
  --danger:#ff6b5c; --crys:#b98cff; --gold:#ffd06a;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--abyss);color:var(--read);font-family:var(--sans);font-size:13px;
  display:flex;justify-content:center;align-items:stretch;-webkit-font-smoothing:antialiased}
#panel{width:100%;max-width:412px;display:flex;flex-direction:column;background:var(--hull);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);overflow:hidden}

/* ---------- header ---------- */
header{flex:none;padding:7px 10px 6px;border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#0e1c27,#0a141d)}
.hrow{display:flex;align-items:center;gap:8px}
.mark{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
.tankpick{display:flex;gap:3px;margin-left:auto}
.tankpick button{font-family:var(--mono);font-size:9px;letter-spacing:.1em;background:#0a1620;
  color:var(--dim);border:1px solid var(--rule);padding:3px 6px;cursor:pointer;border-radius:2px}
.tankpick button.on{color:var(--lume);border-color:#2c5a63;background:#0d2028}
.tankpick button:disabled{opacity:.35;cursor:not-allowed}
.wallet{display:flex;gap:13px;margin-top:5px;align-items:baseline}
.w{font-family:var(--mono);font-size:13.5px}
.w small{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--dim);display:block;margin-bottom:1px}
.w b{font-weight:500}
.w.cr b{color:var(--crys)}
.rate{font-family:var(--mono);font-size:8.5px;color:#4e7a86;margin-left:auto;text-align:right;line-height:1.5}

/* ---------- tank view ---------- */
#tankwrap{flex:none;position:relative;background:#020609;border-bottom:1px solid var(--rule)}
#tank{display:block;width:100%}
#event{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;padding:5px 8px;display:none;gap:8px;align-items:center;
  background:rgba(6,14,20,.86);border-top:1px solid #2a3f2c}
#event.show{display:flex}
#event .etxt{color:var(--amber);flex:1}
#event button{font-family:var(--mono);font-size:9px;letter-spacing:.1em;background:#1d2a18;
  border:1px solid #3c5533;color:#cfe6b4;padding:3px 8px;cursor:pointer;border-radius:2px}

/* ---------- water ---------- */
#water{flex:none;padding:8px 10px 9px;border-bottom:1px solid var(--rule);background:var(--hull2)}
.param{margin-bottom:8px}
.param:last-of-type{margin-bottom:0}
.prow{display:flex;align-items:baseline;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  color:var(--dim);margin-bottom:3px}
.prow .pv{margin-left:auto;letter-spacing:.04em;font-size:11px;color:var(--read)}
.prow .pv.bad{color:var(--amber)}
.track{position:relative;height:16px}
.bands{position:absolute;left:0;right:0;top:5px;height:6px;border-radius:1px;background:#081219;overflow:hidden}
.bands i{position:absolute;top:0;bottom:0;display:block}
.bands u{position:absolute;top:0;bottom:0;border-left:1px solid var(--lume);border-right:1px solid var(--lume);
  background:rgba(79,216,196,.14)}
input[type=range]{-webkit-appearance:none;appearance:none;position:absolute;left:-2px;right:-2px;top:0;
  width:calc(100% + 4px);height:16px;background:transparent;margin:0;cursor:ew-resize}
input[type=range]:focus-visible{outline:1px solid var(--lume);outline-offset:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:16px;border-radius:1px;
  background:var(--read);border:0;box-shadow:0 0 6px rgba(214,235,242,.5)}
input[type=range]::-moz-range-thumb{width:5px;height:16px;border-radius:1px;border:0;
  background:var(--read);box-shadow:0 0 6px rgba(214,235,242,.5)}
.legend{font-family:var(--mono);font-size:8.5px;color:#4a6d79;margin-top:6px;letter-spacing:.04em;line-height:1.5}

/* ---------- nav ---------- */
nav{flex:none;display:flex;border-bottom:1px solid var(--rule);background:#08121a}
nav button{flex:1;font-family:var(--sans);font-size:9.5px;letter-spacing:.04em;background:none;border:0;
  border-bottom:2px solid transparent;color:#5b7c89;padding:7px 0 6px;cursor:pointer;position:relative}
nav button.on{color:var(--lume);border-bottom-color:var(--lume);background:#0b1a22}
nav button b{display:block;font-weight:400;font-size:6.5px;font-family:var(--mono);color:#3f5f6b;
  letter-spacing:.06em;margin-top:2px}
nav button.on b{color:#3d7c78}
nav button em{position:absolute;top:3px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
nav button em.cr{background:var(--crys)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;min-height:130px}

/* ===== desktop: keep the tank on screen while browsing the tabs ===== */
@media (min-width:880px){
  body{align-items:stretch}
  #panel{max-width:1180px;height:100vh;display:grid;
    grid-template-columns:424px minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"head nav" "tank body" "water body"}
  header{grid-area:head;border-right:1px solid var(--rule)}
  #tankwrap{grid-area:tank;border-right:1px solid var(--rule)}
  #water{grid-area:water;border-right:1px solid var(--rule);border-bottom:0;overflow-y:auto}
  nav{grid-area:nav}
  main{grid-area:body;min-height:0;padding:12px 14px}
  nav button{font-size:11px;padding:9px 0 8px}
  nav button b{font-size:7.5px}
  .wallet{gap:18px}
  .w{font-size:15px}
  .dex{grid-template-columns:repeat(8,1fr)}
  .mus,.mhead{grid-template-columns:1fr repeat(3,46px)}
  .mcell{height:40px}
  .grid button{min-width:96px}
  button.act{font-size:9.5px;padding:6px 10px}
  .crewslot div{height:60px}
}
@media (min-width:1320px){
  #panel{max-width:1340px;grid-template-columns:500px minmax(0,1fr)}
  main{padding:14px 18px}
  .dex{grid-template-columns:repeat(10,1fr)}
  /* long flat lists read better split in two on a very wide column */
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-thumb{background:#1e3746;border-radius:3px}

/* ---------- generic bits ---------- */
h2{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--dim);font-weight:400;margin:2px 0 7px}
h2:not(:first-child){margin-top:15px}
.hint{font-size:11px;color:#5f8290;line-height:1.55;margin-bottom:8px}
.row{display:flex;align-items:center;gap:7px;padding:6px 7px;margin-bottom:4px;background:#0a1720;
  border:1px solid #162935;border-radius:3px;flex-wrap:wrap}
.row.sel{border-color:#2f6a6e;background:#0c1f26}
.row.gone{opacity:.45}
.row.wait{border-color:#5c4526;background:#1a1509}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.nm{font-size:11.5px;line-height:1.3;min-width:0;flex:1}
.nm em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:#5f8290;display:block}
.meta{font-family:var(--mono);font-size:9px;color:#5f8290;text-align:right;line-height:1.45;flex:none}
.hp{width:34px;height:3px;background:#16242c;border-radius:2px;overflow:hidden;margin-top:2px;margin-left:auto}
.hp i{display:block;height:100%;background:var(--lume)}
.hp.low i{background:var(--danger)}
.stars{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.05em}
button.act{font-family:var(--mono);font-size:9px;letter-spacing:.1em;background:#12242e;
  border:1px solid #23414f;color:#a9cfda;padding:5px 8px;cursor:pointer;border-radius:2px;flex:none}
button.act:hover:not(:disabled){border-color:#3a6a7a;color:var(--read)}
button.act:disabled{opacity:.32;cursor:not-allowed}
button.act.go{background:#0f2a28;border-color:#2c6058;color:#8fe0cf}
button.act.warn{background:#2a1a16;border-color:#5c332a;color:#e8a48f}
button.act.cr{background:#1d1630;border-color:#4b3a72;color:#cdb4ff}
button.act.big{padding:10px 8px;font-size:10.5px;letter-spacing:.14em}
.grid{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.grid button{flex:1;min-width:74px}
.tag{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:#4a6d79;border:1px solid #1c3441;
  padding:2px 4px;border-radius:2px;flex:none}
.tag.ok{color:var(--lume);border-color:#2c5a63}
.tag.hot{color:var(--amber);border-color:#5c4526}
.tag.cr{color:var(--crys);border-color:#4b3a72}
.bar{height:4px;background:#122029;border-radius:2px;overflow:hidden;margin:5px 0 9px}
.bar i{display:block;height:100%;background:#3f7f8c}
.bar.food i{background:#7fa855}
.bar.meat i{background:#b0644a}
.bar.waste i{background:#8a7a3c}
.bar.thin{margin:4px 0 0;height:3px}
.node{padding:7px 8px;margin-bottom:4px;background:#0a1720;border:1px solid #162935;border-radius:3px}
.node.done{border-color:#245049;background:#0a1d1e}
.node .nh{display:flex;align-items:center;gap:7px}
.node .nt{font-size:11.5px;flex:1}
.node .nd{font-size:10.5px;color:#5f8290;line-height:1.5;margin-top:3px}
.gene{display:flex;gap:6px;font-family:var(--mono);font-size:8.5px;color:#5f8290;margin-top:3px}
.gene span b{color:#9dc4d0;font-weight:400}
.log{font-family:var(--mono);font-size:9.5px;line-height:1.75;color:#5f8290}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log b{color:#8fb4c0;font-weight:400}
.log .wn{color:var(--amber)}
.log .gd{color:var(--lume)}
.log .cr{color:var(--crys)}
.empty{font-size:11px;color:#4a6d79;padding:12px 4px;line-height:1.6}
.warnbox{padding:8px 10px;margin-bottom:8px;border-radius:4px;font-size:11px;line-height:1.6;
  background:#2a1408;border:1px solid #7a3a1c;color:#ffcfae}
textarea{width:100%;height:60px;resize:vertical;font-family:var(--mono);font-size:9.5px;line-height:1.5;
  color:var(--read);background:#08131a;border:1px solid #1c3441;border-radius:3px;padding:6px;margin-bottom:6px}

/* ---------- EXPEDITION ---------- */
.expwrap{margin:-10px -10px 0;padding:10px;background:
  radial-gradient(120% 70% at 50% 0%,#0c2434,#050d14 72%)}
.exphead{display:flex;align-items:flex-end;gap:8px;margin-bottom:9px}
.exphead h1{font-size:19px;font-weight:600;letter-spacing:.02em;line-height:1}
.exphead h1 small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.24em;
  color:#4e7a86;margin-bottom:3px;font-weight:400}
.depthbadge{margin-left:auto;text-align:right;font-family:var(--mono)}
.depthbadge b{display:block;font-size:21px;font-weight:500;color:var(--lume);line-height:1}
.depthbadge small{font-size:8px;letter-spacing:.18em;color:#4e7a86}
.o2{margin-bottom:10px}
.o2 .lab{display:flex;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:4px}
.o2 .lab span:last-child{margin-left:auto;color:var(--read)}
.o2bar{height:8px;border-radius:5px;background:#08161d;overflow:hidden;box-shadow:inset 0 0 0 1px #1c3441}
.o2bar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#3fd0e0,#7fe3d0);transition:width .4s}
.o2bar.low i{background:linear-gradient(90deg,#ff6b5c,#ffb24a)}
.profile{position:relative;margin:0 0 10px;padding-left:26px}
.profile .axis{position:absolute;left:11px;top:4px;bottom:4px;width:2px;
  background:linear-gradient(180deg,#1f4454,#0a1a22)}
.stg{position:relative;margin-bottom:5px;padding:6px 8px;border-radius:3px;
  background:#0a1720;border:1px solid #162935;font-size:11px;line-height:1.4}
.stg:before{content:"";position:absolute;left:-19px;top:11px;width:9px;height:9px;border-radius:50%;
  background:#0d1f28;border:2px solid #24485a}
.stg.done:before{background:var(--lume);border-color:#2c6058}
.stg.now{border-color:#2c6058;background:#0c1f26}
.stg.now:before{background:var(--amber);border-color:#5c4526;
  box-shadow:0 0 0 4px rgba(255,178,74,.16)}
.stg .sd{font-family:var(--mono);font-size:8.5px;color:#5f8290;letter-spacing:.06em}
.stg .gain{color:var(--lume);font-family:var(--mono);font-size:9.5px}
.stg .loss{color:var(--amber);font-family:var(--mono);font-size:9.5px}
.cargo{background:#0a1720;border:1px solid #1e3a3a;border-radius:4px;padding:8px 9px;margin-bottom:10px}
.cargo h4{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--dim);
  font-weight:400;margin-bottom:6px}
.cargo .ci{display:flex;font-family:var(--mono);font-size:11px;line-height:1.9}
.cargo .ci span:last-child{margin-left:auto;color:var(--lume)}
.cargo .ci.cr span:last-child{color:var(--crys)}
.decide{display:flex;gap:6px;margin-bottom:8px}
.decide button{flex:1}
.sitecard{position:relative;padding:9px 10px;margin-bottom:6px;border-radius:4px;overflow:hidden;
  background:linear-gradient(100deg,#0b1c26,#0a141b);border:1px solid #1a3140;cursor:pointer}
.sitecard.on{border-color:#2c6058;background:linear-gradient(100deg,#0d2a2a,#0a1c22)}
.sitecard.lock{opacity:.5;cursor:not-allowed}
.sitecard .st{display:flex;align-items:baseline;gap:7px}
.sitecard .st b{font-size:12.5px;font-weight:600}
.sitecard .st .dep{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--lume)}
.sitecard .sd{font-size:10.5px;color:#5f8290;line-height:1.5;margin-top:3px}
.crewslot{display:flex;gap:5px;margin-bottom:8px}
.crewslot div{flex:1;height:52px;border-radius:4px;border:1px dashed #24485a;background:#08141b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--mono);font-size:8.5px;color:#3f5f6b}
.crewslot div.full{border-style:solid;border-color:#2c6058;background:#0c1f26;color:var(--read)}
.crewslot div .dot{width:12px;height:12px}

/* ---------- AQUARIUM ---------- */
.aqwrap{margin:-10px -10px 0;padding:12px 10px 10px;
  background:radial-gradient(120% 80% at 50% 0%,#2a2113,#0a1016 74%)}
.aqhead{text-align:center;margin-bottom:10px}
.aqhead h1{font-size:20px;font-weight:600;letter-spacing:.06em}
.aqhead small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.26em;
  color:#8a7346;margin-bottom:4px}
.rating{font-size:25px;letter-spacing:.14em;color:var(--gold);line-height:1.2;
  text-shadow:0 0 16px rgba(255,208,106,.28)}
.aqstat{display:flex;gap:6px;margin-bottom:10px}
.aqstat div{flex:1;text-align:center;padding:7px 4px;border-radius:4px;
  background:rgba(255,208,106,.06);border:1px solid rgba(255,208,106,.18)}
.aqstat b{display:block;font-family:var(--mono);font-size:14px;color:var(--gold);line-height:1.2}
.aqstat span{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:#8a7346}
.score{margin-bottom:9px}
.score .sr{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:5px}
.score .sr span:first-child{width:52px;color:#9db3bd;flex:none}
.score .sb{flex:1;height:5px;border-radius:3px;background:#141a20;overflow:hidden}
.score .sb i{display:block;height:100%;background:linear-gradient(90deg,#b98a3a,var(--gold))}
.score .sr b{font-family:var(--mono);font-size:9.5px;color:var(--gold);width:38px;text-align:right;flex:none}
.vip{padding:9px 10px;margin-bottom:6px;border-radius:4px;
  background:linear-gradient(180deg,#241a2f,#141020);border:1px solid #4b3a72}
.vip h4{font-size:12px;font-weight:600;color:#cdb4ff;margin-bottom:4px}
.vip .vd{font-size:10.5px;color:#9d8fc0;line-height:1.55}
.vip .vr{font-family:var(--mono);font-size:10px;color:var(--crys);margin-top:5px}
.mus{display:grid;grid-template-columns:1fr repeat(3,38px);gap:3px;align-items:center;margin-bottom:3px}
.mus .mn{font-size:10.5px;color:#9db3bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:4px}
.mus .mn small{font-family:var(--mono);font-size:7.5px;color:#5f8290;display:block}
.mus.full .mn{color:var(--gold)}
.mcell{height:34px;border-radius:4px;background:#0b141b;border:1px solid #17242e;
  display:flex;align-items:center;justify-content:center;position:relative}
.mcell.have{background:#1b1710;border-color:rgba(255,208,106,.45);
  box-shadow:inset 0 0 10px rgba(255,208,106,.10)}
.mcell.seen{background:#0d1620;border-color:#1c2b36}
.mcell.none:after{content:"·";color:#25333d;font-size:15px;line-height:1}
.mcell svg{display:block}
.mcell .qp{position:absolute;right:2px;bottom:1px;font-family:var(--mono);font-size:7px;
  color:var(--gold);opacity:.85}
.mcell.seen svg{opacity:.28}
.mhead{display:grid;grid-template-columns:1fr repeat(3,38px);gap:3px;margin-bottom:5px}
.mhead span{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:#5f8290;text-align:center}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.filt button{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:4px 8px;
  border-radius:20px;cursor:pointer;background:#0a1620;border:1px solid #1c3441;color:#5f8290}
.filt button.on{background:#0d2028;border-color:#2c5a63;color:var(--lume)}
.jrow{display:flex;gap:8px;padding:6px 8px;margin-bottom:3px;border-radius:3px;
  background:#0a1720;border-left:2px solid #1e3746;align-items:flex-start}
.jrow.gd{border-left-color:var(--lume)}
.jrow.wn{border-left-color:var(--amber)}
.jrow.cr{border-left-color:var(--crys)}
.jrow .jt{flex:1;font-size:11px;line-height:1.5;min-width:0;word-break:break-word}
.jrow .jt b{color:var(--read);font-weight:500}
.jrow .jm{font-family:var(--mono);font-size:8.5px;color:#4a6d79;white-space:nowrap;flex:none;padding-top:2px}
.jday{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:#3f5f6b;
  margin:12px 0 5px;padding-bottom:3px;border-bottom:1px solid #16242e}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dex span{aspect-ratio:1;border-radius:3px;background:#0a1620;border:1px solid #162935;
  display:flex;align-items:center;justify-content:center}
.dex span.on{border-color:#2c5a63;background:#0c1f26}
</style>
</head>
<body>
<div id="panel">
  <header>
    <div class="hrow"><span class="mark">DEEP TANK</span><span class="tankpick" id="tankpick"></span></div>
    <div class="wallet">
      <span class="w"><small>BUBBLES</small><b id="wBub">0</b></span>
      <span class="w cr"><small>CRYSTAL</small><b id="wCry">0</b></span>
      <span class="w"><small>DATA</small><b id="wData">0</b></span>
      <span class="rate" id="wRate"></span>
    </div>
  </header>
  <div id="tankwrap">
    <canvas id="tank"></canvas>
    <div id="event"><span class="etxt" id="etxt"></span><button id="ebtn"></button></div>
  </div>
  <div id="water">
    <div class="param"><div class="prow"><span>TEMP</span><span class="pv" id="vTemp"></span></div>
      <div class="track"><div class="bands" id="bTemp"></div>
        <input type="range" id="sTemp" min="4" max="30" step="0.2" aria-label="温度"></div></div>
    <div class="param"><div class="prow"><span>WATER</span><span class="pv" id="vO2"></span></div>
      <div class="track"><div class="bands" id="bO2"></div>
        <input type="range" id="sO2" min="30" max="100" step="1" aria-label="水质"></div></div>
    <div class="legend" id="legend"></div>
  </div>
  <nav id="nav">
    <button data-t="tank" class="on">水槽<b>TANK</b></button>

const hasWS=()=>!!(window.storage&&window.storage.get&&window.storage.set);
const hasLS=()=>{try{if(!window.localStorage)return false;

const Store={
  async get(k){let v=null;
    if(hasWS()){try{const r=await window.storage.get(k);if(r&&r.value)v=r.value;}catch(e){}}
    if(!v&&hasLS()){try{const r=localStorage.getItem(k);if(r)v=r;}catch(e){}}
    return v;},
  async set(k,v){let wrote=0,err="";
    if(hasWS()){try{await window.storage.set(k,v);wrote++;}catch(e){err=String(e&&e.message||e);}}
    if(hasLS()){try{localStorage.setItem(k,v);wrote++;}catch(e){err=String(e&&e.message||e);}}
    if(k===KEY){IO.ok=wrote>0;IO.at=Date.now();IO.err=wrote?"":(err||"没有可用的存储后端");}
    return wrote>0;}
};

function gene0(){return{v:clamp(rnd(.92,1.10),.5,2.0),h:clamp(rnd(0,.5),0,7),f:clamp(rnd(.92,1.08),.45,1.7)};}
function makeFish(sp,mo,stage,g,gen){
  return{u:uid++,sp,mo:mo||"base",stage:stage||0,gro:stage===2?200:stage===1?70:0,hp:100,
    sex:Math.random()<.5?"F":"M",cd:0,age:0,gen:gen||1,g:g||gene0(),xp:0,lk:false,
    x:rnd(.12,.88),y:rnd(.2,.8),dir:Math.random()<.5?-1:1,ty:rnd(.2,.8),turn:rnd(.5,4),
    pitch:0,ph:rnd(0,TAU),sp2:rnd(.6,1.1)};
}
const fishName=f=>SPECIES[f.sp].nm+(f.mo!=="base"?"·"+MORPH[f.mo].nm:"");
const fishLen=f=>SPECIES[f.sp].len*[.5,.75,1][f.stage];
const dexKey=f=>f.sp+":"+f.mo;
function xpTier(f){const x=f.xp||0;let i=0;for(let k=0;k<XPTIER.length;k++)if(x>=XPTIER[k].x)i=k;return i;}
const xpName=f=>XPTIER[xpTier(f)].nm;
function stars(f){
  const sc=(f.g.v-.9)/1.1*.55+clamp(f.g.h/5,0,1)*.27+clamp((1.1-f.g.f)/.55,0,1)*.18;
  return clamp(1+Math.round(sc*4.2),1,5);
}
const starStr=f=>{const n=stars(f);return"★".repeat(n)+"☆".repeat(5-n);};
function recordDex(f){
  const k=dexKey(f);
  if(!S.dex[k]){S.dex[k]=1;S.data+=10;log("图鉴记录 <b>"+fishName(f)+"</b>  +10 数据","gd");}
}
const LOGCAT={
  life :{nm:"生活",test:/孵化|长成|死亡|吃掉|购入|卖出|移入|安置|放归|补给/},
  breed:{nm:"育种",test:/配对|产下|品系|拼接|登记|苗场/},
  dive :{nm:"远征",test:/远征|出发|启程|归来|失踪|遗物|发现新鱼种|深度/},
  hall :{nm:"展馆",test:/入藏|集齐|贵宾|评审|展馆|门票/},
  lab  :{nm:"研究",test:/研究|图鉴|里程碑|达成|理论|项目|传承/},
  warn :{nm:"异常",test:/病|缺氧|骤降|漂移|藻华|水质|已满|不能|至少/}
};
const LKEYS=Object.keys(LOGCAT);
function logCat(t){
  const plain=t.replace(/<[^>]*>/g,"");
  for(const k of LKEYS)if(LOGCAT[k].test.test(plain))return k;
  return "life";
}
function log(t,cls,cat){
  S.log.unshift({t,c:cls||"",k:cat||logCat(t),a:Math.round(S.age)});
  if(S.log.length>260)S.log.length=260;
  dirty.log=1;dirty.journal=1;
}
function ago(a){
  const d=Math.max(0,Math.round(S.age-a));
  if(d<60)return d+"秒前";
  if(d<3600)return Math.floor(d/60)+"分钟前";
  if(d<86400)return Math.floor(d/3600)+"小时前";
  return Math.floor(d/86400)+"天前";
}
function hex2hsl(h){
  let r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hu=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    hu=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hu*=60;}
  return[hu,s*100,l*100];
}
function fishColor(f,alpha){
  const m=MORPH[f.mo]||MORPH.base,hsl=hex2hsl(SPECIES[f.sp].col);
  const H=(hsl[0]+m.shift+360)%360,Sa=clamp(hsl[1]*m.sat,0,100),L=clamp(hsl[2]*m.lit,6,94);
  return alpha===undefined?"hsl("+H+" "+Sa+"% "+L+"%)":"hsla("+H+" "+Sa+"% "+L+"% / "+alpha+")";
}
function placeFish(f,prefer){
  const order=[];const p=S.tanks[prefer];
  if(p&&p.unlocked)order.push(p);
  for(const z of S.tanks)if(z.unlocked&&order.indexOf(z)<0)order.push(z);
  for(const z of order)if(z.fish.length<cap()){z.fish.push(f);return z;}
  S.hold.push(f);return null;
}
function hatchTime(){return Math.round(50*(S.res.incub?.55:1)*(REL("eggcase")?.75:1));}

/* ===================== water & comfort ===================== */
function padBase(){return(S.res.heater?1.5:0)+(REL("crown")?.8:0);}
function fitBand(v,band,p){
  const lo=band[0]-p,hi=band[1]+p;
  if(v>=lo&&v<=hi)return 1;
  const d=v<lo?lo-v:v-hi,span=Math.max(2.5,(hi-lo)*.55);
  return clamp(1-d/span,0,1);
}
function o2Pen(t){
  let p=t.waste*.26+Math.max(0,t.fish.length-4)*1.1;
  if(S.ev&&S.ev.k==="hypox"&&S.ev.tk===t.i)p+=12;
  return p;
}
const effO2=t=>clamp(t.o2-o2Pen(t),0,100);
function symb(t){
  const sp={};let carn=0;
  for(const f of t.fish){sp[f.sp]=1;if(SPECIES[f.sp].diet==="carn"&&f.stage===2)carn++;}
  const k=Object.keys(sp).length;
  return{scav:!!sp.grazer&&Object.keys(sp).some(x=>SPECIES[x].diet==="carn"),
    lumen:!!(sp.tetra&&sp.lantern),drift:!!(sp.ray&&sp.squid),diverse:k>=4,apex:carn>=2,kinds:k};
}
function refreshThreat(t){
  let m=0;for(const f of t.fish)if(SPECIES[f.sp].diet==="carn"&&f.stage>=1)m=Math.max(m,fishLen(f));
  t.threat=m;
}
function comfort(f,t){
  const d=SPECIES[f.sp],p=padBase()+f.g.h;
  const a=fitBand(t.temp,d.temp,p),b=fitBand(effO2(t),d.o2,p*2);
  let v=clamp(.42*((a+b)/2)+.58*Math.min(a,b),0,1);
  if(d.diet!=="carn"&&t.threat&&fishLen(f)<t.threat*.72)v*=t.decor.wreck?.96:.9;
  return v;
}
function avgComfort(s){
  const arr=allFish(s);if(!arr.length)return 0;
  let sum=0;for(const t of s.tanks){refreshThreat(t);for(const x of t.fish)sum+=comfort(x,t);}
  return sum/arr.length;
}
function tankBestComfort(s){
  let best=0;
  for(const t of s.tanks){
    if(!t.unlocked||!t.fish.length)continue;
    refreshThreat(t);
    let sum=0;for(const f of t.fish)sum+=comfort(f,t);
    best=Math.max(best,sum/t.fish.length);
  }
  return best;
}

/* ===================== income (additive, not multiplicative) ===================== */
const FISHK=.40;
function schoolBonus(f,t){
  let n=0;for(const o of t.fish)if(o.sp===f.sp)n++;
  return n>=5?.25:n>=3?.15:0;
}
function fishIncome(f,t){
  const d=SPECIES[f.sp];
  let bonus=MORPH[f.mo].bonus+(f.g.v-1)+schoolBonus(f,t)
    +(S.res.manifold?.25:0)+S.theory*THEORY.gain
    +(REL("pump")?.15:0)+(PERK("yield")?.25:0)
    +Object.keys(S.strains).length*(PERK("vault")?.04:.02);
  const sy=symb(t);
  if(sy.lumen&&d.glow>0)bonus+=.18;
  if(sy.drift)bonus+=.12;
  if(sy.apex)bonus+=.15;
  if(S.res.lightA&&d.glow>0)bonus+=.30;
  return FISHK*d.rate*[.25,.6,1][f.stage]*comfort(f,t)*(f.hp/100)*(1+bonus);
}
/* ---- museum:每种鱼的每个形态只能入藏一次，入藏后永久保留 ---- */
const mKey=(sp,mo)=>sp+":"+mo;
const donated=(sp,mo)=>!!(S.museum&&S.museum[mKey(sp,mo)]);
const museumCount=()=>Object.keys(S.museum||{}).length;
const MUSEUM_SLOTS=SKEYS.length*MKEYS.length;
const speciesComplete=sp=>MKEYS.every(mo=>donated(sp,mo));
/* an exhibit is worth more the better the specimen behind it */
function specQuality(o){
  return clamp((o.v-.9)/1.1,0,1)*.62+clamp(o.h/5,0,1)*.22+clamp((1.1-o.f)/.55,0,1)*.16;
}
function exhibitBonus(o){return 1+specQuality(o)*1.6;}
function donateReward(sp,mo,f){
  const t=SPECIES[sp].tier;
  const q=f?exhibitBonus({v:f.g.v,h:f.g.h,f:f.g.f}):1;
  return{bub:Math.floor(SPECIES[sp].cost*(1+MORPH[mo].bonus)*2.4*q),
    cry:Math.max(1,Math.round((1+t*1.5+(mo==="irid"?2:mo==="aurora"?6:0))*q)),
    data:Math.round((8+t*5+(mo==="base"?0:10))*q),q};
}
/* donating a strictly better specimen upgrades the existing exhibit */
function upgradeGain(f){
  const cur=S.museum[mKey(f.sp,f.mo)];
  if(!cur)return 0;
  return specQuality({v:f.g.v,h:f.g.h,f:f.g.f})-specQuality(cur);
}
function canDonate(f){
  if(!f||f.lk||f.stage<2)return false;
  if(!donated(f.sp,f.mo))return true;
  return upgradeGain(f)>=.04;
}
function donate(u){
  let src=null,tk=null;
  for(const t of S.tanks){const i=t.fish.findIndex(x=>x.u===u);if(i>=0){src=t.fish[i];tk=t;break;}}
  if(!src||!canDonate(src))return;
  if(allFish(S).length<=1){log("至少要留一条鱼看家","wn");return;}
  const isUp=donated(src.sp,src.mo);
  const r=donateReward(src.sp,src.mo,src);
  if(isUp){r.bub=Math.floor(r.bub*.45);r.cry=Math.max(1,Math.round(r.cry*.5));r.data=Math.round(r.data*.5);}
  S.museum[mKey(src.sp,src.mo)]={sp:src.sp,mo:src.mo,gen:src.gen,
    v:src.g.v,h:src.g.h,f:src.g.f,stars:stars(src),at:Math.round(S.age)};
  tk.fish.splice(tk.fish.indexOf(src),1);
  S.sel=S.sel.filter(x=>x!==u);S.crew=S.crew.filter(x=>x!==u);
  S.stats.donated++;S.bub+=r.bub;S.data+=r.data;
  let bonus=0;
  const v=S.hall.vip;
  if(v&&v.sp===src.sp&&v.mo===src.mo){bonus=Math.floor(v.cry*.6);S.hall.vip=null;S.hall.vipCd=rnd(360,620);}
  gainCry(r.cry*(REL("ledger")?1.25:1)+bonus,(isUp?"展品升级 · ":"入藏 · ")+fishName(src)+(bonus?"（贵宾求购加成）":""));
  log("<b>"+fishName(src)+"</b> "+(isUp?"替换了原展品":"已入藏")+"  +"+fmt(r.bub)+" 泡 +"+r.data+" 数据","gd");
  if(!isUp&&speciesComplete(src.sp)){
    S.stats.sets++;
    gainCry(6+SPECIES[src.sp].tier*3,"集齐 "+SPECIES[src.sp].nm+" 全部形态");
    S.data+=40;
  }
  dirty.aqua=dirty.stock=dirty.breed=dirty.lab=1;
}
/* ---- exhibition hall ---- */
function hallScore(s){
  s=s||S;
  const mus=s.museum||{};
  let coll=0,rare=0;const spSeen={};
  for(const k in mus){
    const e=mus[k];if(!SPECIES[e.sp])continue;
    coll+=(4+SPECIES[e.sp].tier*2)*exhibitBonus(e);
    rare+=(e.mo==="irid"?6:e.mo==="aurora"?14:0);
    spSeen[e.sp]=1;
  }
  let sets=0;
  for(const sp of SKEYS)if(MKEYS.every(mo=>!!mus[sp+":"+mo]))sets+=12;
  let art=0;
  for(const t of s.tanks)if(t.unlocked)for(const k in t.decor)if(t.decor[k])art+=DECOR[k].art;
  if(s.res.lightA)art+=10;
  art+=(s.hall.up.light||0)*6;
  const guide=(s.hall.up.guide||0)*5;
  const breadth=Object.keys(spSeen).length*3;
  /* fittings can only amplify a real collection, never replace one */
  const base=coll+rare+sets+breadth;
  const capF=30+base*1.5;
  const fit=Math.min(art+guide,capF);
  return{coll:Math.round(coll),rare:Math.round(rare),sets,breadth,
    art:Math.round(art),guide,fit:Math.round(fit),capped:art+guide>capF,
    total:Math.round(base+fit)};
}
function hallStars(s){
  const t=hallScore(s||S).total;
  return t>=620?5:t>=400?4:t>=220?3:t>=95?2:t>=28?1:0;
}
function ticketPrice(){return 1+(S.hall.up.ticket||0)*.6;}
function hallIncome(){
  if(!S.hall.open)return 0;
  return Math.pow(hallScore().total,1.10)*.055*ticketPrice();
}
function visitors(){return Math.round(Math.pow(hallScore().total,1.10)*.16);}
function income(){
  let r=0;
  for(const t of S.tanks){refreshThreat(t);for(const f of t.fish)r+=fishIncome(f,t);}
  return r+hallIncome();
}
function dataRate(){
  const kinds={};let sum=0,n=0;
  for(const t of S.tanks)for(const f of t.fish){kinds[dexKey(f)]=1;sum+=comfort(f,t);n++;}
  if(!n)return 0;
  let m=(S.res.observ?1.6:1)*(REL("lens")?1.2:1)*(PERK("insight")?1.3:1);
  if(S.tanks.some(t=>t.unlocked&&t.fish.length&&symb(t).diverse))m*=1.2;
  return .020*Object.keys(kinds).length*(sum/n)*m;
}
function gainCry(n,why){
  n=Math.floor(n);if(n<=0)return 0;
  S.cry+=n;S.stats.cryTotal+=n;
  if(why)log(why+"  <b>+"+n+" 结晶</b>","cr");
  return n;
}
/* ===================== main step ===================== */
function step(dt,light){
  S.age+=dt;
  S.bub+=income()*dt;
  S.data+=dataRate()*dt;
  if(S.bub>S.stats.peakBub)S.stats.peakBub=S.bub;

  for(const t of S.tanks){
    if(!t.unlocked)continue;
    refreshThreat(t);
    const n=t.fish.length;
    if(!S.res.heater){
      const drift=(S.ev&&S.ev.k==="surge"&&S.ev.tk===t.i)?.05:.012;
      t.temp=clamp(t.temp+(21-t.temp)*.0004*dt+(Math.random()-.5)*drift*dt,4,30);
    }
    if(S.res.feeder&&n){
      if(t.plant<18){const f=FOODS.feed;
        if(S.bub>=f.cost){S.bub-=f.cost;t.plant=clamp(t.plant+f.add,0,100);t.waste=clamp(t.waste+f.add*f.mess*.5,0,100);}}
      if(t.meat<18&&t.fish.some(f=>SPECIES[f.sp].diet==="carn")){const f=FOODS.krill;
        if(S.bub>=f.cost){S.bub-=f.cost;t.meat=clamp(t.meat+f.add,0,100);t.waste=clamp(t.waste+f.add*f.mess*.5,0,100);}}
    }
    let herb=0,carn=0;
    for(const f of t.fish){
      const need=.003+fishLen(f)*.00025;
      if(SPECIES[f.sp].diet==="carn")carn+=need;else herb+=need;
    }
    const gp=Math.min(t.plant,herb*dt),gm=Math.min(t.meat,carn*dt);
    t.plant=clamp(t.plant-gp,0,100);t.meat=clamp(t.meat-gm,0,100);
    const pF=herb>0?gp/(herb*dt):1,mF=carn>0?gm/(carn*dt):1;
    /* waste: filtration now scales with population instead of a flat trickle */
    let clean=0;
    if(S.res.filter)clean+=.02+.006*n;
    if(REL("netfilter"))clean*=1.6;
    for(const f of t.fish)if(SPECIES[f.sp].clean)clean+=SPECIES[f.sp].clean*[.4,.7,1][f.stage];
    if(symb(t).scav)clean*=1.5;
    if(t.waste>70)clean+=.012;
    const gen=.0025*n*(REL("spore")?.65:1);
    t.waste=clamp(t.waste+gen*dt-clean*dt,0,100);

    for(let i=t.fish.length-1;i>=0;i--){
      const f=t.fish[i],d=SPECIES[f.sp],c=comfort(f,t),fed=d.diet==="carn"?mF:pF;
      f.age+=dt;
      let dh=0,bad=false;
      dh+=(c-.62)*2.2;
      if(c<.62)bad=true;
      if(fed<.5)dh-=(.5-fed)*1.2;
      if(t.waste>62){dh-=(t.waste-62)*.028;bad=true;}
      if(S.ev&&S.ev.k==="ich"&&S.ev.tk===t.i){dh-=.6;bad=true;}
      if(dh<0)dh*=Math.sqrt(clamp(f.hp/100,.10,1));
      f.hp=clamp(f.hp+dh*dt*.25,0,100);
      if(!bad&&f.hp<6)f.hp=6;
      if(light&&f.hp<10)f.hp=10;
      if(f.hp<=0){t.fish.splice(i,1);S.stats.died++;
        log("<b>"+fishName(f)+"</b> 死亡 — 检查水质","wn");dirty.stock=dirty.breed=1;continue;}
      if(f.stage<2){
        f.gro+=dt*.70*c*(fed>.5?1:.25)*(f.hp/100);
        const th=f.stage===0?70:200;
        if(f.gro>=th){f.stage++;dirty.stock=dirty.breed=1;
          if(f.stage===2)log("<b>"+fishName(f)+"</b> 长成成鱼 "+starStr(f));}
      }
      if(f.cd>0)f.cd=Math.max(0,f.cd-dt);
    }
    if(!light)for(const f of t.fish){
      if(SPECIES[f.sp].diet!=="carn"||f.stage<1)continue;
      const ch=(mF<.6?.0012:.00008)*dt*(t.decor.wreck?.6:1);
      if(Math.random()<ch){
        const prey=t.fish.filter(o=>o!==f&&!o.show&&fishLen(o)<fishLen(f)*.72);
        if(prey.length){const v=pick(prey);t.fish.splice(t.fish.indexOf(v),1);
          S.stats.eaten++;t.waste=clamp(t.waste+6,0,100);
          log("<b>"+fishName(f)+"</b> 吃掉了 "+fishName(v),"wn");dirty.stock=dirty.breed=1;}
      }
    }
    for(let i=t.eggs.length-1;i>=0;i--){
      const e=t.eggs[i];e.t-=dt;
      if(e.t<=0){
        t.eggs.splice(i,1);
        let sex=null;
        if(PERK("pair")){
          const same=t.fish.filter(f=>f.sp===e.sp);
          if(same.length&&!same.some(f=>f.sex==="F"))sex="F";
          else if(same.length&&!same.some(f=>f.sex==="M"))sex="M";
        }
        const f=makeFish(e.sp,e.mo,0,e.g,e.gen);
        if(sex)f.sex=sex;
        S.stats.hatched++;recordDex(f);
        const z=placeFish(f,t.i);
        log("<b>"+fishName(f)+"</b> 孵化 F"+f.gen+" "+starStr(f)+(z?(z!==t?" → "+(z.i+1)+"号缸":""):" · 缸满，已待安置"),z?"gd":"wn");
        dirty.stock=dirty.breed=1;
      }
    }
  }
  diveTick(dt);
  projTick(dt);
  hallTick(dt);
  if(S.ev){S.ev.t-=dt;if(S.ev.t<=0){S.ev=null;S.evCd=rnd(300,560);dirty.ev=1;}}
  else{S.evCd-=dt;if(S.evCd<=0){rollEvent();S.evCd=rnd(300,560);}}
  if(!allFish(S).length&&!S.hold.length&&!S.dives.length&&S.bub<SPECIES.minnow.cost){
    const h=S.tanks.find(z=>z.unlocked);
    if(h){h.fish.push(makeFish("minnow","base",0));log("研究所补给了一条玻璃小鱲","wn");dirty.stock=1;}
  }
  for(const g of GOALS)if(!S.goals[g.id]&&g.chk(S)){
    S.goals[g.id]=1;S.data+=18;log("达成「"+g.nm+"」 +18 数据","gd");dirty.lab=1;
  }
}
function rollEvent(){
  const open=S.tanks.filter(t=>t.unlocked&&t.fish.length);
  if(!open.length)return;
  const t=pick(open);
  const safe=S.age<600||S.bub<300||!allFish(S).some(f=>f.stage===2);
  const kinds=safe?["bloom","bloom"]:["ich","bloom","hypox","bloom"];
  if(!safe&&!S.res.heater)kinds.push("surge");
  const k=pick(kinds);
  if(k==="ich")S.ev={k,tk:t.i,t:600,txt:(t.i+1)+"号缸 白点病 · 健康持续下降"};
  if(k==="bloom"){S.ev={k,tk:t.i,t:180,txt:(t.i+1)+"号缸 藻华 · 饵料回补"};t.plant=clamp(t.plant+45,0,100);}
  if(k==="hypox")S.ev={k,tk:t.i,t:150,txt:(t.i+1)+"号缸 水质骤降 −12"};
  if(k==="surge")S.ev={k,tk:t.i,t:150,txt:(t.i+1)+"号缸 温度失控漂移"};
  log(S.ev.txt,k==="bloom"?"gd":"wn");dirty.ev=1;
}
const ichCost=()=>Math.max(30,Math.min(240,Math.floor(S.bub*.30)));
function eventAction(){
  if(!S.ev)return;
  if(S.ev.k==="ich"){
    if(!S.res.medbay){const c=ichCost();if(S.bub<c)return;S.bub-=c;}
    log("白点病已治疗","gd");
  }
  S.ev=null;S.evCd=rnd(300,560);dirty.ev=1;
}

/* ===================== expedition engine ===================== */
function zoneOpen(k){
  const z=ZONES[k];
  if(!z.need)return true;
  if(z.need==="exped3")return S.stats.exped>=3;
  if(z.need==="sonar")return !!S.res.sonar;
  if(z.need==="legacy")return PERK("deeper");
  return true;
}
function maxDepth(k){return ZONES[k].maxD+(PERK("deeper")?2:0);}
function crewFish(){const t=tank();return S.crew.map(u=>t.fish.find(f=>f.u===u)).filter(Boolean);}
function o2Cost(d,crew){
  const z=ZONES[d.zone];
  let c=z.o2+d.depth*1.1;
  const h=crew.reduce((a,f)=>a+f.g.h,0)/Math.max(1,crew.length);
  c*=1-clamp(h*.05,0,.3);
  c*=1-clamp(crew.reduce((a,f)=>a+xpTier(f),0)*.03,0,.2);
  if(S.res.sonar)c*=.8;
  if(REL("charm"))c*=.85;
  return Math.max(3,c);
}
function startDive(zk){
  const z=ZONES[zk];
  if(!z||!zoneOpen(zk)||S.dives.length>=diveCap())return;
  if(S.bub<z.cost)return;
  const t=tank(),crew=crewFish().filter(f=>f.stage===2&&!f.lk);
  if(!crew.length)return;
  if(allFish(S).length-crew.length<1){log("至少要留一条鱼看家","wn");return;}
  S.bub-=z.cost;
  for(const f of crew)t.fish.splice(t.fish.indexOf(f),1);
  S.crew=[];
  const vAvg=crew.reduce((a,f)=>a+f.g.v,0)/crew.length;
  const haul=clamp(.58+vAvg*.48,.62,2.2);
  S.dives.push({id:uid++,zone:zk,crew,tk:t.i,depth:0,haul,
    o2:100+(PERK("o2tank")?25:0),o2max:100+(PERK("o2tank")?25:0),
    stage:{t:z.stage,tot:z.stage},pending:null,logs:[],
    cargo:{bub:0,cry:0,data:0,eggs:[],relic:null,species:null}});
  log("远征启程 · "+z.nm+"（"+crew.length+" 名队员，采集效率 ×"+haul.toFixed(2)+"）");
  dirty.exp=dirty.stock=dirty.breed=1;
}
function encWeights(d){
  const w=[];
  for(const k of EKEYS){
    let x=ENC[k].w(d.depth);
    if(REL("compass")&&["vein","crys","relic","fauna","cache","calm"].indexOf(k)>=0)x*=1.3;
    w.push([k,x]);
  }
  return w;
}
function rollEnc(d){
  const w=encWeights(d);
  let tot=0;for(const p of w)tot+=p[1];
  let r=Math.random()*tot;
  for(const p of w){r-=p[1];if(r<=0)return p[0];}
  return "vein";
}
function applyEnc(d,k){
  const z=ZONES[d.zone],dep=d.depth,scale=(1+dep*.55)*(d.haul||1);
  const e=ENC[k];
  let txt="",gain="",loss="";
  if(k==="vein"){const v=Math.floor(rnd(z.pay[0],z.pay[1])*scale*.5);d.cargo.bub+=v;gain="+"+fmt(v)+" 泡";}
  else if(k==="crys"){const v=Math.max(1,Math.floor((1+dep*.75)*rnd(.9,1.5)));d.cargo.cry+=v;gain="+"+v+" 结晶";}
  else if(k==="data"){const v=Math.floor(rnd(8,18)*scale*.6);d.cargo.data+=v;gain="+"+v+" 数据";}
  else if(k==="egg"){
    /* shallow water yields ordinary stock; the good genes live deep */
    const tcap=Math.min(5,1+Math.floor(dep/2));
    const pool=SKEYS.filter(s=>(!SPECIES[s].find||S.disc[s])
      &&SPECIES[s].tier<=tcap&&(SPECIES[s].tier<4||S.res.manifest));
    const sp=pick(pool.length?pool:["minnow"]);
    let mo="base";
    if(Math.random()<clamp(dep*.035-.03,0,.55))
      mo=(dep>=6&&Math.random()<.20)?"aurora":"irid";
    d.cargo.eggs.push({sp,mo,g:{v:clamp(rnd(.90,1.00+dep*.055),.5,2.0),
      h:clamp(rnd(.2,.6+dep*.14),0,7),f:clamp(rnd(.84,1.02),.45,1.7)}});
    gain=SPECIES[sp].nm+"·"+MORPH[mo].nm+" 卵";
  }
  else if(k==="relic"){
    const left=RLKEYS.filter(x=>!S.relics[x]&&!(d.cargo.relic===x));
    if(left.length&&!d.cargo.relic){d.cargo.relic=pick(left);gain=RELICS[d.cargo.relic].nm;}
    else{const v=Math.floor(rnd(z.pay[0],z.pay[1])*scale*.4);d.cargo.bub+=v;gain="残片换算 +"+fmt(v)+" 泡";}
  }
  else if(k==="fauna"){
    const und=SKEYS.filter(x=>SPECIES[x].find&&!S.disc[x]&&SPECIES[x].tier<=2+Math.floor(dep/3));
    if(und.length&&!d.cargo.species){d.cargo.species=pick(und);gain="发现 "+SPECIES[d.cargo.species].nm;}
    else{const v=Math.max(1,Math.floor(dep*.8));d.cargo.cry+=v;gain="标本记录 +"+v+" 结晶";}
  }
  else if(k==="current"){const v=Math.floor(rnd(8,16));d.o2=clamp(d.o2-v,0,d.o2max);loss="−"+v+" 氧气";}
  else if(k==="calm"){const v=Math.floor(rnd(8,15));d.o2=clamp(d.o2+v,0,d.o2max);gain="+"+v+" 氧气";}
  else if(k==="cache"){
    const v=Math.floor(rnd(z.pay[0],z.pay[1])*scale*1.1),c=Math.max(1,Math.floor(dep*.7));
    d.cargo.bub+=v;d.cargo.cry+=c;gain="+"+fmt(v)+" 泡 +"+c+" 结晶";
  }
  else if(k==="pred"){
    const victim=pick(d.crew);
    const esc=clamp(.55+victim.g.h*.07+xpTier(victim)*.08,.3,.95);
    if(Math.random()<esc){const v=Math.floor(rnd(5,12));d.o2=clamp(d.o2-v,0,d.o2max);loss="甩脱追击 −"+v+" 氧气";}
    else{
      d.crew.splice(d.crew.indexOf(victim),1);S.stats.lost++;
      if(!d.lostNames)d.lostNames=[];
      d.lostNames.push(fishName(victim));
      loss=fishName(victim)+" 失踪";
      if(!d.crew.length){loss+=" · 全队覆没";}
    }
  }
  txt=e.ico+" "+e.nm;
  d.logs.push({d:dep,txt,gain,loss});
  return {txt,gain,loss};
}
function diveTick(dt){
  for(let i=S.dives.length-1;i>=0;i--){
    const d=S.dives[i];
    if(!d.crew.length){bankDive(d,"全队失踪");continue;}
    if(d.pending)continue;
    d.stage.t-=dt;
    if(d.stage.t>0)continue;
    const cost=o2Cost(d,d.crew);
    d.depth++;
    d.o2=clamp(d.o2-cost,0,d.o2max);
    if(d.depth>S.stats.maxDepth)S.stats.maxDepth=d.depth;
    applyEnc(d,rollEnc(d));
    if(!d.crew.length){bankDive(d,"全队失踪");continue;}
    const z=ZONES[d.zone];
    if(d.o2<=0){bankDive(d,"氧气耗尽，紧急上浮");continue;}
    if(d.depth>=maxDepth(d.zone)){d.pending="floor";}
    else if(d.o2<o2Cost(d,d.crew)){d.pending="lowo2";}
    else d.pending="choice";
    dirty.exp=1;
  }
}
function diveDecide(id,go){
  const d=S.dives.find(x=>x.id===id);
  if(!d||!d.pending)return;
  if(!go){bankDive(d,"顺利返航");return;}
  if(d.pending==="floor"||d.o2<o2Cost(d,d.crew)){bankDive(d,"顺利返航");return;}
  d.pending=null;
  d.stage.t=d.stage.tot=ZONES[d.zone].stage;
  dirty.exp=1;
}
function bankDive(d,why){
  const idx=S.dives.indexOf(d);if(idx>=0)S.dives.splice(idx,1);
  const forced=/耗尽|覆没|失踪/.test(why);
  const keep=forced?.65:1;
  const rep={id:uid++,zone:d.zone,depth:d.depth,why,forced,
    bub:Math.floor(d.cargo.bub*keep),cry:Math.floor(d.cargo.cry*keep),
    data:Math.floor(d.cargo.data*keep),eggs:0,relic:null,species:null,
    back:[],lost:(d.lostNames||[]).slice(),promoted:[],logs:d.logs};
  if(d.depth>0&&d.crew.length){
    const zf=ZONES[d.zone].maxD>=9?1.1:.8;
    rep.depthBonus=Math.floor(Math.pow(d.depth,1.3)*zf);
    rep.cry+=rep.depthBonus;
  }
  S.bub+=rep.bub;S.data+=rep.data;
  if(rep.cry)gainCry(rep.cry);
  if(!forced||Math.random()<.5){
    if(d.cargo.relic&&!S.relics[d.cargo.relic]){S.relics[d.cargo.relic]=1;rep.relic=RELICS[d.cargo.relic].nm;}
    if(d.cargo.species&&!S.disc[d.cargo.species]){S.disc[d.cargo.species]=1;rep.species=SPECIES[d.cargo.species].nm;}
  }
  for(const e of d.cargo.eggs){
    const home=S.tanks.find(z=>z.unlocked&&z.eggs.length<eggCap());
    if(!home)break;
    const t=hatchTime();
    home.eggs.push({sp:e.sp,mo:e.mo,g:e.g,gen:1,t,tot:t});rep.eggs++;
  }
  for(const f of d.crew){
    const before=xpTier(f);f.xp=(f.xp||0)+1;
    if(xpTier(f)>before)rep.promoted.push(fishName(f)+" → "+xpName(f));
    placeFish(f,d.tk);rep.back.push(fishName(f));
  }
  if(d.depth>0){S.stats.exped++;if(d.depth>=4)S.stats.deepDive++;}
  S.reports.unshift(rep);
  if(S.reports.length>3)S.reports.length=3;
  log("远征结束 · "+ZONES[d.zone].nm+" 深度 "+d.depth+" — "+why,forced?"wn":"gd");
  dirty.exp=dirty.stock=dirty.breed=dirty.lab=1;
}

/* ===================== projects ===================== */
function offerProject(){
  const avail=PROJECTS.filter(p=>!S.proj.done[p.id]&&!S.proj.active.some(a=>a.id===p.id));
  if(!avail.length)return;
  const p=pick(avail);
  S.proj.active.push({id:p.id,stage:0,timer:0});
  log("新科研项目 · "+p.nm);
  dirty.proj=1;
}
const projDef=id=>PROJECTS.find(p=>p.id===id);
function projTick(dt){
  S.proj.cd-=dt;
  if(S.proj.cd<=0){S.proj.cd=rnd(420,720);if(S.proj.active.length<2)offerProject();}
  for(const a of S.proj.active){
    const def=projDef(a.id);if(!def)continue;
    const st=def.stages[a.stage];if(!st)continue;
    if(st.timed){
      if(st.chk(S))a.timer=Math.min(st.timed,a.timer+dt);
      else a.timer=Math.max(0,a.timer-dt*.5);
      if(a.timer>=st.timed)advanceProj(a);
    }else if(st.count){
      if((S.stats[st.count.key]||0)-(a.base||0)>=st.count.need)advanceProj(a);
      else if(a.base===undefined)a.base=S.stats[st.count.key]||0;
    }else if(st.chk&&st.chk(S))advanceProj(a);
  }
}
function advanceProj(a){
  const def=projDef(a.id);
  a.stage++;a.timer=0;a.base=undefined;
  if(a.stage>=def.stages.length){
    S.proj.active.splice(S.proj.active.indexOf(a),1);
    S.proj.done[a.id]=1;S.stats.projects++;
    const bonus=REL("ledger")?1.25:1;
    gainCry(def.cry*bonus,"项目完成 · "+def.nm);
    S.data+=def.data;
    log("科研项目达成 <b>"+def.nm+"</b>  +"+def.data+" 数据","gd");
  }else log("项目推进 · "+def.nm+" 阶段 "+(a.stage+1),"gd");
  dirty.proj=1;
}
function deliverProj(aid){
  const a=S.proj.active.find(x=>x.id===aid);if(!a)return;
  const def=projDef(aid),st=def.stages[a.stage];
  if(!st||!st.deliver)return;
  const d=st.deliver,pool=allFish(S).filter(f=>!f.lk&&f.stage>=(d.stage||0)
    &&(!d.morph||f.mo!=="base")&&(!d.minGen||f.gen>=d.minGen));
  let use=[];
  if(d.sameSp){
    const by={};pool.forEach(f=>{(by[f.sp]=by[f.sp]||[]).push(f);});
    for(const k in by)if(by[k].length>=d.count){use=by[k].slice(0,d.count);break;}
  }else use=pool.slice(0,d.count);
  if(use.length<d.count)return;
  for(const f of use){
    for(const t of S.tanks){const i=t.fish.indexOf(f);if(i>=0){t.fish.splice(i,1);break;}}
    S.sel=S.sel.filter(x=>x!==f.u);
  }
  advanceProj(a);
  dirty.stock=dirty.breed=1;
}
function canDeliver(a){
  const def=projDef(a.id),st=def.stages[a.stage];
  if(!st||!st.deliver)return false;
  const d=st.deliver,pool=allFish(S).filter(f=>!f.lk&&f.stage>=(d.stage||0)
    &&(!d.morph||f.mo!=="base")&&(!d.minGen||f.gen>=d.minGen));
  if(d.sameSp){
    const by={};pool.forEach(f=>{(by[f.sp]=by[f.sp]||[]).push(f);});
    return Object.keys(by).some(k=>by[k].length>=d.count);
  }
  return pool.length>=d.count;
}

/* ===================== hall: VIP + judging ===================== */
function hallTick(dt){
  const h=S.hall;
  if(h.vip){h.vip.t-=dt;if(h.vip.t<=0){log("贵宾离开了","wn");h.vip=null;h.vipCd=rnd(360,620);dirty.aqua=1;}}
  else{h.vipCd-=dt*(REL("chime")?1.4:1);
    if(h.vipCd<=0&&Object.keys(S.dex).length>=3){makeVip();h.vipCd=rnd(360,620);}}
  if(h.judge){h.judge.t-=dt;if(h.judge.t<=0){h.judge=null;h.judgeCd=rnd(600,900);dirty.aqua=1;}}
  else{h.judgeCd-=dt;if(h.judgeCd<=0&&allFish(S).some(f=>f.stage===2)){makeJudge();h.judgeCd=rnd(600,900);}}
}
function makeVip(){
  const keys=Object.keys(S.dex);
  const k=pick(keys),p=k.split(":");
  S.hall.vip={sp:p[0],mo:p[1],t:rnd(900,1500),
    cry:Math.floor((8+SPECIES[p[0]].tier*4)*(p[1]==="base"?1:p[1]==="irid"?1.7:2.6))};
  log("贵宾来访 · 想看 "+SPECIES[p[0]].nm+"·"+MORPH[p[1]].nm,"cr");
  dirty.aqua=1;
}
function vipSatisfied(){
  const v=S.hall.vip;if(!v)return false;
  return donated(v.sp,v.mo);
}
function claimVip(){
  if(!vipSatisfied())return;
  const v=S.hall.vip;
  gainCry(v.cry*(REL("ledger")?1.25:1),"贵宾满意 · "+SPECIES[v.sp].nm);
  S.stats.vip++;S.hall.vip=null;S.hall.vipCd=rnd(360,620);
  dirty.aqua=1;
}
const FOCUS={v:"产出基因",h:"耐受基因",s:"综合星级"};
function makeJudge(){
  const live={};for(const f of allFish(S))if(f.stage===2)live[f.sp]=1;
  const pool=Object.keys(live);if(!pool.length)return;
  S.hall.judge={sp:pick(pool),focus:pick(["v","h","s"]),t:rnd(1500,2400)};
  log("评审来访 · "+SPECIES[S.hall.judge.sp].nm+"组","cr");
  dirty.aqua=1;
}
function judgeScore(f){
  const j=S.hall.judge;
  if(j.focus==="v")return clamp((f.g.v-.95)/1.05,0,1);
  if(j.focus==="h")return clamp(f.g.h/4.5,0,1);
  return clamp((stars(f)-1)/4,0,1);
}
function judgeEligible(){
  const j=S.hall.judge;if(!j)return[];
  return allFish(S).filter(f=>f.sp===j.sp&&f.stage===2);
}
function submitJudge(u){
  const j=S.hall.judge;if(!j)return;
  const f=allFish(S).find(x=>x.u===u);
  if(!f||f.sp!==j.sp||f.stage<2)return;
  const sc=judgeScore(f),scale=1+SPECIES[j.sp].tier*.4;
  let tier,cry;
  if(sc>=.80){tier="金奖";cry=Math.floor(26*scale);}
  else if(sc>=.55){tier="银奖";cry=Math.floor(13*scale);}
  else if(sc>=.28){tier="铜奖";cry=Math.floor(6*scale);}
  else{tier="未入围";cry=1;}
  gainCry(cry,"评审 "+tier+" · "+fishName(f));
  S.stats.judge++;S.hall.judge=null;S.hall.judgeCd=rnd(600,900);
  dirty.aqua=1;
}
/* ===================== actions ===================== */
function fishCry(sp){
  const t=SPECIES[sp].tier;
  return t>=5?26:t>=4?12:t>=3?4:0;
}
function shopList(){
  return SKEYS.filter(k=>{
    const d=SPECIES[k];
    if(d.find)return !!S.disc[k];
    if(d.tier>=4&&!S.res.manifest)return false;

  });
}
function fitTag(sp){
  const t=tank(),d=SPECIES[sp],p=padBase();
  const m=Math.min(fitBand(t.temp,d.temp,p),fitBand(effO2(t),d.o2,p*2));
  if(m>=1)return'<span class="tag ok">当前适配</span>';
  if(m>=.55)return'<span class="tag">需调水</span>';

function buyFish(sp){
  const d=SPECIES[sp],t=tank(),cc=fishCry(sp);
  if(S.bub<d.cost||S.cry<cc||t.fish.length>=cap())return;
  S.bub-=d.cost;if(cc)S.cry-=cc;
  const f=makeFish(sp,"base",0);
  const same=t.fish.filter(x=>x.sp===sp);
  if(same.length===1)f.sex=same[0].sex==="F"?"M":"F";
  t.fish.push(f);S.stats.bought++;recordDex(f);
  log("购入 <b>"+fishName(f)+"</b> "+starStr(f));
  dirty.stock=dirty.breed=1;
}
function sellFish(u){
  const t=tank(),i=t.fish.findIndex(f=>f.u===u);if(i<0)return;
  const f=t.fish[i];
  if(f.lk)return;
  const val=Math.floor(SPECIES[f.sp].cost*[.35,.55,.85][f.stage]*(1+MORPH[f.mo].bonus)*(.7+f.g.v*.4));
  S.bub+=val;t.fish.splice(i,1);
  S.sel=S.sel.filter(x=>x!==u);S.crew=S.crew.filter(x=>x!==u);
  log("卖出 <b>"+fishName(f)+"</b>  +"+val);
  dirty.stock=dirty.breed=dirty.aqua=1;
}
function moveFish(u,to){
  const dst=S.tanks[to];
  if(!dst||!dst.unlocked||dst.fish.length>=cap())return;
  for(const t of S.tanks){
    const i=t.fish.findIndex(f=>f.u===u);
    if(i<0)continue;
    if(t===dst)return;
    const f=t.fish.splice(i,1)[0];
    dst.fish.push(f);
    S.sel=S.sel.filter(x=>x!==u);S.crew=S.crew.filter(x=>x!==u);
    log("<b>"+fishName(f)+"</b> 移入 "+(to+1)+" 号缸");
    dirty.stock=dirty.breed=dirty.exp=1;return;
  }
}
function placeHeld(u,to){
  const i=S.hold.findIndex(f=>f.u===u);if(i<0)return;
  const dst=S.tanks[to];
  if(!dst||!dst.unlocked||dst.fish.length>=cap())return;
  dst.fish.push(S.hold.splice(i,1)[0]);

function releaseHeld(u){
  const i=S.hold.findIndex(f=>f.u===u);if(i<0)return;
  const f=S.hold.splice(i,1)[0];
  const val=Math.floor(SPECIES[f.sp].cost*[.35,.55,.85][f.stage]*(1+MORPH[f.mo].bonus));
  S.bub+=val;log("放归 <b>"+fishName(f)+"</b>  +"+val);dirty.stock=1;

function feed(k){
  const f=FOODS[k],t=tank();

function buyDecor(k){

function sellDecor(k){

function toggleSel(u){

  if(a.sp!==b.sp)return{ok:0,why:"必须是同一鱼种",a,b};
  if(a.stage<2||b.stage<2)return{ok:0,why:"两条都必须是成鱼",a,b};
  if(a.sex===b.sex)return{ok:0,why:"需要一雌一雄",a,b};
  if(a.hp<70||b.hp<70)return{ok:0,why:"健康度需 ≥ 70",a,b};
  if(comfort(a,t)<.7||comfort(b,t)<.7)return{ok:0,why:"适应度需 ≥ 70%",a,b};
  if(a.cd>0||b.cd>0)return{ok:0,why:"冷却中 "+mmss(Math.max(a.cd,b.cd)),a,b};

function animate(dt){
  const t=tank();
  for(const f of t.fish){
    if(f.dir===undefined){f.dir=Math.random()<.5?-1:1;f.ty=f.y;f.turn=rnd(.5,4);f.pitch=0;}
    f.turn-=dt;
    if(f.turn<=0){f.turn=rnd(2.6,7.5);
      if(Math.random()<.42)f.dir*=-1;
      f.ty=clamp(f.y+rnd(-.26,.26),.15,.87);}
    const spd=.052*f.sp2*(26/Math.max(19,fishLen(f)*1.9))*(.45+f.hp/180);
    f.x+=f.dir*spd*dt;
    if(f.x<.06){f.x=.06;f.dir=1;f.turn=Math.max(f.turn,1.2);}
    if(f.x>.94){f.x=.94;f.dir=-1;f.turn=Math.max(f.turn,1.2);}
    const vy=clamp((f.ty-f.y)*.55,-.05,.05);
    f.ph+=dt*(2.0+spd*9);
    f.y=clamp(f.y+vy*dt+Math.sin(f.ph)*.0035*dt,.13,.89);
    const want=clamp(Math.atan2(vy,Math.max(spd,.02))*.55,-.30,.30);
    f.pitch=lerp(f.pitch||0,want,1-Math.exp(-2.6*dt));
  }
  if(Math.random()<.18*t.fish.length*dt)
    bubbles.push({x:rnd(6,CW-6),y:CH-6,r:rnd(.8,2.1),a:rnd(.15,.4),v:rnd(.16,.42)});
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.y-=b.v*dt*60;b.x+=Math.sin(b.y*.08)*.22;
    if(b.y<-4)bubbles.splice(i,1);}
}

function bandsFor(id,param,min,max){
  const t=tank(),p=padBase(),off=param==="o2"?o2Pen(t):0;
  const seen={};
  for(const f of t.fish)if(!seen[f.sp]||f.g.h>seen[f.sp])seen[f.sp]=f.g.h;
  const list=Object.keys(seen);
  let html="",lo=-Infinity,hi=Infinity;
  for(const sp of list){
    const b=SPECIES[sp][param],pad=(p+seen[sp])*(param==="o2"?2:1);
    const a=b[0]-pad+off,z=b[1]+pad+off;
    lo=Math.max(lo,a);hi=Math.min(hi,z);
    const l=((a-min)/(max-min))*100,w=((z-a)/(max-min))*100;
    html+='<i style="left:'+clamp(l,0,100)+"%;width:"+clamp(w,0,100)+"%;background:"+fishColor({sp,mo:"base"},.30)+'"></i>';
  }
  if(list.length>1&&hi>lo){
    const l=((lo-min)/(max-min))*100,w=((hi-lo)/(max-min))*100;
    html+='<u style="left:'+clamp(l,0,100)+"%;width:"+clamp(w,0,100)+'%"></u>';
  }
  $(id).innerHTML=html;
}

/* ---------- HALL ---------- */
function museumGrid(){
  let h='<div class="mhead"><span></span><span>原色</span><span>虹彩</span><span>极光</span></div>';
  for(const sp of SKEYS){
    const full=speciesComplete(sp);
    const known=MKEYS.some(mo=>S.dex[sp+":"+mo])||donated(sp,"base");
    const have=MKEYS.filter(mo=>donated(sp,mo)).length;
    h+='<div class="mus'+(full?" full":"")+'"><div class="mn">'+
      (known?SPECIES[sp].nm:"？？？")+"<small>"+(known?("T"+SPECIES[sp].tier+" · "+have+"/3"):"未发现")+"</small></div>";
    for(const mo of MKEYS){
      if(donated(sp,mo)){
        const e=S.museum[mKey(sp,mo)];
        h+='<div class="mcell have" title="'+SPECIES[sp].nm+"·"+MORPH[mo].nm+" F"+e.gen+
          " 产出"+e.v.toFixed(2)+" 品质×"+exhibitBonus(e).toFixed(2)+'">'+fishIcon(sp,mo,26)+
          '<span class="qp">'+(e.stars||3)+"</span></div>";

        h+='<div class="mcell seen" title="图鉴已记录，尚未捐赠">'+fishIcon(sp,mo,26)+"</div>";
      }else h+='<div class="mcell none"></div>';
    }
    h+="</div>";
  }
  return h;
}

let jFilter="all";
function tabJournal(){
  const counts={all:S.log.length};
  for(const k of LKEYS)counts[k]=0;
  for(const l of S.log)if(counts[l.k]!==undefined)counts[l.k]++;
  let h='<h2>运营日志 · 最近 '+S.log.length+' 条</h2>'+
    '<div class="hint">记录最近发生的事，最多保留 260 条。切换标签只看某一类。</div>';
  h+='<div class="filt"><button data-jf="all" class="'+(jFilter==="all"?"on":"")+'">全部 '+counts.all+"</button>";
  for(const k of LKEYS)
    h+='<button data-jf="'+k+'" class="'+(jFilter===k?"on":"")+'" '+(counts[k]?"":"disabled")+">"+
      LOGCAT[k].nm+" "+counts[k]+"</button>";
  h+="</div>";
  const list=S.log.filter(l=>jFilter==="all"||l.k===jFilter);
  if(!list.length){h+='<div class="empty">这一类还没有记录。</div>';return h;}
  let lastBand=null;
  for(const l of list.slice(0,150)){
    const d=Math.max(0,S.age-(l.a||0));
    const band=d<300?"刚刚":d<3600?"最近一小时":d<10800?"三小时内":d<86400?"今天早些时候":"更早";
    if(band!==lastBand){h+='<div class="jday">'+band+"</div>";lastBand=band;}
    h+='<div class="jrow '+(l.c||"")+'"><div class="jt">'+l.t+'</div><div class="jm">'+ago(l.a||0)+"</div></div>";
  }
  if(list.length>150)h+='<div class="hint" style="margin-top:8px">还有 '+(list.length-150)+" 条更早的记录未显示。</div>";
  return h;
}

function renderTab(force){
  const b=$("body");
  if(holding&&force)force=false;
  const ae=document.activeElement;
  if(force&&ae&&ae.tagName==="TEXTAREA")force=false;
  let html=null;
  if(TAB==="tank"&&(force||dirty.tank))html=tabTank();
  if(TAB==="stock"&&(force||dirty.stock))html=tabStock();
  if(TAB==="breed"&&(force||dirty.breed))html=tabBreed();
  if(TAB==="exp"&&(force||dirty.exp))html=tabExp();
  if(TAB==="aqua"&&(force||dirty.aqua))html=tabAqua();
  if(TAB==="lab"&&(force||dirty.lab||dirty.proj))html=tabLab();
  if(TAB==="journal"&&(force||dirty.journal))html=tabJournal();
  if(html!==null){
    const sp=b.scrollTop;b.innerHTML=html;b.scrollTop=sp;
    dirty.tank=dirty.stock=dirty.breed=dirty.exp=dirty.aqua=dirty.lab=dirty.proj=dirty.journal=0;
  }

    if(bars.length>=3){bars[0].style.width=t.plant+"%";bars[1].style.width=t.meat+"%";bars[2].style.width=t.waste+"%";}
  }
  if(TAB==="lab"&&dirty.log){const lb=$("logbox");if(lb)lb.innerHTML=logHTML();dirty.log=0;}
}

$("body").addEventListener("click",e=>{
  const el=e.target.closest("[data-feed],[data-decor],[data-undecor],[data-buy],[data-sell],[data-lock],[data-move],"+
    "[data-hplace],[data-hrelease],[data-pick],[data-breed],[data-splice],[data-reg],[data-res],[data-theory],"+

    "[data-donate],[data-egg],[data-deliver],[data-legacy],[data-perk],[data-io],[data-jf],[data-reset]");

  else if(d.decor)buyDecor(d.decor);
  else if(d.undecor)sellDecor(d.undecor);
  else if(d.buy)buyFish(d.buy);

  else if(d.lock){const f=allFish(S).find(x=>x.u===+d.lock);if(f){f.lk=!f.lk;dirty.stock=dirty.exp=1;}}

  else if(d.hplace){const a=d.hplace.split("_");placeHeld(+a[0],+a[1]);}
  else if(d.hrelease)releaseHeld(+d.hrelease);
  else if(d.pick)toggleSel(+d.pick);
  else if(d.breed)breed();
  else if(d.splice){S.spliceSel=(d.splice==="_none"||S.spliceSel===d.splice)?null:d.splice;dirty.breed=1;}
  else if(d.reg)registerStrain(+d.reg);
  else if(d.res)research(d.res);
  else if(d.theory)buyTheory();
  else if(d.crew){
    if(d.crew==="_none")S.crew=[];
    else{const u=+d.crew,i=S.crew.indexOf(u);
      if(i>=0)S.crew.splice(i,1);else if(S.crew.length<crewCap())S.crew.push(u);}
    dirty.exp=1;
  }
  else if(d.launch)startDive(d.launch);
  else if(d.dive){const a=d.dive.split("_");diveDecide(+a[1],a[0]==="go");}
  else if(d.rep){const i=S.reports.findIndex(r=>r.id===+d.rep);if(i>=0)S.reports.splice(i,1);dirty.exp=1;}
  else if(d.donate)donate(+d.donate);
  else if(d.vip)claimVip();
  else if(d.judge)submitJudge(+d.judge);
  else if(d.hallup)buyHallUp(d.hallup);
  else if(d.egg)buyEgg(d.egg);
  else if(d.deliver)deliverProj(d.deliver);
  else if(d.legacy){if(confirm("世代传承会重置鱼群、货币和研究，保留图鉴/遗物/品系。确定？"))doLegacy();}
  else if(d.perk)buyPerk(d.perk);
  else if(d.io){
    const box=$("ioBox");
    if(box&&d.io!=="export")ioText=box.value;
    if(d.io==="export"){ioText=exportSave();ioMsg="已生成，全选复制保存到别处。";}
    else if(d.io==="copy"){
      if(!ioText)ioText=exportSave();
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(ioText).then(()=>{ioMsg="已复制。";dirty.lab=1;renderTab(1);},
          ()=>{ioMsg="复制被拦下了，请手动全选复制。";dirty.lab=1;renderTab(1);});
      else ioMsg="这个浏览器不支持一键复制。";
    }else if(d.io==="file"){
      try{
        const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);
        a.download="deep-tank-save-"+new Date().toISOString().slice(0,10)+".json";a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),4000);
        ioMsg="已开始下载。";
      }catch(err){ioMsg="下载失败，请改用存档码。";}
    }else if(d.io==="import"){
      if(confirm("导入会覆盖当前进度，确定？")){
        const err=importSave(ioText);
        if(err)ioMsg="导入失败 — "+err;
        else{ioMsg="";ioText="";log("存档已导入","gd");
          dirty.pick=dirty.tank=dirty.stock=dirty.breed=dirty.exp=dirty.aqua=dirty.lab=1;
          renderPick();renderWater(1);}
      }
    }
    dirty.lab=1;
  }
  else if(d.jf){jFilter=d.jf;dirty.journal=1;}
  else if(d.reset){
    if(confirm("清空存档，从零开始？")){S=newState();save(true);renderPick();renderWater(1);}
  }
  renderTab(1);renderWallet();renderWater();
});

let bakAt=0;
function save(force){
  S.t=Date.now();
  const json=JSON.stringify(S);
  Store.set(KEY,json);
  if(force||Date.now()-bakAt>120000){bakAt=Date.now();Store.set(BAK,json);}
}
function exportSave(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){return"";}}
function importSave(code){
  let txt=String(code||"").trim();
  if(!txt)return "没有内容";
  try{
    if(txt.charAt(0)!=="{")txt=decodeURIComponent(escape(atob(txt)));
    const o=JSON.parse(txt);
    if(!o||!o.tanks||!o.stats)return "这不是一份 DEEP TANK 存档";
    adopt(o);save(true);return "";
  }catch(e){return "解析失败：内容可能被截断或改动过";}
}

function migrate(o){
  const legacy={pts:0,perks:{},runs:0};
  const st=newState(legacy);
  const map={base:"base",albino:"irid",melanic:"irid",irid:"irid",aurora:"aurora"};
  if(o.dex)for(const k in o.dex){const p=k.split(":");if(SPECIES[p[0]]&&map[p[1]])st.dex[p[0]+":"+map[p[1]]]=1;}
  if(o.disc)for(const k in o.disc)if(SPECIES[k])st.disc[k]=1;
  if(o.relics)for(const k in o.relics)if(RELICS[k])st.relics[k]=1;
  if(o.strains)for(const k in o.strains){
    const r=o.strains[k];
    if(SPECIES[k]&&r)st.strains[k]={sp:k,mo:map[r.mo]||"base",v:clamp(r.v||1,.5,2),h:clamp(r.h||0,0,7),
      f:clamp(r.f||1,.45,1.7),gen:r.gen||1,stars:r.stars||3,score:r.score||1};
  }
  const dexN=Object.keys(st.dex).length;
  st.bub=1200+dexN*120;
  st.cry=10+Object.keys(st.relics).length*4+Object.keys(st.strains).length*3;
  st.data=120;
  st.tanks[0].fish.push(makeFish("minnow","base",1),makeFish("guppy","base",1));
  log("检测到旧版本存档 — 图鉴、遗物、发现与品系已继承，并附赠启动物资","gd");
  return st;
}
function adopt(o){
  if(o.v!==3){S=migrate(o);return;}
  S=Object.assign(newState(o.legacy),o);
  while(S.tanks.length<3)S.tanks.push(newTank(S.tanks.length));
  if(S.tanks.length>3)S.tanks.length=3;
  S.tanks.forEach((t,i)=>{t.i=i;if(!t.decor)t.decor={};if(!t.eggs)t.eggs=[];if(!t.fish)t.fish=[];});
  ["dex","disc","goals","res","strains","relics","museum"].forEach(k=>{if(!S[k])S[k]={};});
  for(const t of S.tanks)for(const f of t.fish)if(f.show!==undefined)delete f.show;
  ["hold","log","dives","crew","reports","sel"].forEach(k=>{if(!S[k])S[k]=[];});
  if(!S.proj)S.proj={active:[],done:{},cd:60};
  if(!S.hall)S.hall={open:true,vip:null,vipCd:300,judge:null,judgeCd:540,up:{light:0,guide:0,ticket:0}};
  if(!S.hall.up)S.hall.up={light:0,guide:0,ticket:0};
  if(!S.legacy)S.legacy={pts:0,perks:{},runs:0,claimedP:0};
  if(S.legacy.claimedP===undefined)S.legacy.claimedP=0;
  if(!S.stats)S.stats=freshStats();
  for(const k in freshStats())if(S.stats[k]===undefined)S.stats[k]=0;
  S.theory=S.theory||0;
  S.tanks[0].unlocked=1;
  if(S.res.tank2)S.tanks[1].unlocked=1;
  if(S.res.tank3)S.tanks[2].unlocked=1;
  for(const t of S.tanks)for(const f of t.fish)uid=Math.max(uid,f.u+1);
  for(const f of S.hold)uid=Math.max(uid,f.u+1);
  for(const d of S.dives)for(const f of d.crew)uid=Math.max(uid,f.u+1);
  catchUp();
}
function catchUp(){
  const away=clamp((Date.now()-(S.t||Date.now()))/1000,0,60*60*8);
  S.t=Date.now();
  if(away<=8)return;
  /* offline runs at a reduced rate — idling is upkeep, not progress */
  let left=away,eff=0;
  while(left>0){
    const d=Math.min(5,left);
    const scale=eff<7200?1:.35;
    step(d*scale,true);
    left-=d;eff+=d;
  }
  log("离开 "+(away<3600?Math.round(away/60)+" 分钟":(away/3600).toFixed(1)+" 小时")+" 已结算");
  dirty.tank=dirty.stock=dirty.breed=dirty.exp=dirty.aqua=dirty.lab=1;
}
async function load(){
  for(const k of [KEY,BAK].concat(LEGACY)){
    const raw=await Store.get(k);
    if(!raw)continue;
    try{
      const o=JSON.parse(raw);
      if(!o||!o.tanks)continue;
      adopt(o);
      if(k!==KEY){log(k===BAK?"主存档读取失败，已从备份恢复":"已从旧版本存档升级","wn");save(true);}
      return;
    }catch(e){}
  }
}
/* ===================== loop ===================== */
let last=performance.now(),acc=0,uiAcc=0,saveAcc=0,liveAcc=0;
function loop(now){
  const gap=(now-last)/1000,dt=Math.min(.25,gap);last=now;
  if(gap>3)catchUp();
  acc+=dt;uiAcc+=dt;saveAcc+=dt;
  while(acc>=.25){step(.25,false);acc-=.25;}
  animate(dt);render();
  if(uiAcc>=.4){
    uiAcc=0;liveAcc+=.4;
    renderWallet();renderWater();renderEvent();
    if(dirty.pick){renderPick();dirty.pick=0;}
    renderTab(false);
    if(liveAcc>=1.2){liveAcc=0;if(TAB!=="lab")renderTab(true);}
  }
  S.t=Date.now();
  if(saveAcc>=12){saveAcc=0;save();}
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)save(true);
  else{catchUp();last=performance.now();renderPick();renderWater(1);renderTab(1);renderWallet();}
});
window.addEventListener("beforeunload",()=>save(true));
load().then(()=>{
  if(!S.log.length)log("水槽已注水。买一条鱼，把温度调进它的色带，然后去「远征」看看。");
  renderPick();renderWater(1);renderTab(1);renderWallet();renderEvent();
  requestAnimationFrame(loop);
});
</script>
